name: update-illust-maker-snapshots

on:
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  update:
    name: Update illust-maker VRT snapshots
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openameba/spindle-illust-maker test:browser:update
        env:
          BROWSER_TEST: 'true'
      # vitest browser mode はテストファイルと同じ階層の __screenshots__/ に出力する
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: illust-maker-snapshots
          path: packages/spindle-illust-maker/src/__screenshots__/
